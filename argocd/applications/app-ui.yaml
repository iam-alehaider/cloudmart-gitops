

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: cloudmart-microservices-eks

  sources:
    # ✅ Source 1: Helm chart from APP repo
    - repoURL: https://github.com/iam-alehaider/cloudmart-microservices-apps.git
      targetRevision: prod
      path: src/ui/chart
      helm:
        valueFiles:
          - $values/envs/prod/ui-values.yaml

    # ✅ Source 2: Values from GITOPS repo
    - repoURL: https://github.com/iam-alehaider/cloudmart-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudmart-microservices-apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

