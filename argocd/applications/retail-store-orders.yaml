

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store-orders
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: retail-store

  sources:
    # ✅ Source 1: Helm chart from APP repo
    - repoURL: https://github.com/iam-alehaider/retail-store-app.git
      targetRevision: prod
      path: src/orders/chart
      helm:
        valueFiles:
          - $values/envs/prod/orders-values.yaml

    # ✅ Source 2: Values from GITOPS repo
    - repoURL: https://github.com/iam-alehaider/retail-store-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

